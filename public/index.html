<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backhoe Rig AR v0.1.2</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#fff}
#camerafeed{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#start{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#111315;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#start.hide{display:none}
.card{width:min(370px,100%);text-align:center}
h1{font-size:24px;margin:0 0 8px}
.sub{font-size:13px;opacity:.68;margin-bottom:20px}
button,#jsonLabel{font:inherit;color:#fff;-webkit-tap-highlight-color:transparent}
#go{border:0;border-radius:999px;background:#fff;color:#111;font-size:16px;font-weight:750;padding:14px 30px;min-width:170px;min-height:48px}
#go:disabled{opacity:.42}
#boot{margin:18px auto 0;max-width:330px;min-height:54px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.055);font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:left;white-space:pre-wrap;word-break:break-word}
#status{position:fixed;z-index:40;left:50%;top:calc(env(safe-area-inset-top) + 9px);transform:translateX(-50%);max-width:calc(100vw - 28px);padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.64);border:1px solid rgba(255,255,255,.16);font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#status.ready{border-color:rgba(103,226,152,.65);color:#b9ffd1}
#hint{position:fixed;z-index:39;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);padding:7px 11px;border-radius:9px;background:rgba(0,0,0,.6);font-size:11px;white-space:nowrap;pointer-events:none;display:none}
#toolbar{position:fixed;z-index:50;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);display:none;gap:5px;max-width:calc(100vw - 18px);padding:5px;border-radius:14px;background:rgba(13,14,15,.86);border:1px solid rgba(255,255,255,.17)}
body.ready #toolbar{display:flex}
#toolbar button,#jsonLabel{min-height:42px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.08);padding:7px 10px;font-size:10.5px;font-weight:650;white-space:nowrap}
#play.playing{background:#28593d}
#toolbar button:disabled{opacity:.35}
#ground.on{border-color:rgba(103,226,152,.6);color:#b9ffd1}
#jsonLabel{position:relative;display:flex;align-items:center;justify-content:center}
#jsonInput{position:absolute;inset:0;width:100%;height:100%;opacity:0}
#info,#action{display:none;position:fixed;z-index:42;top:calc(env(safe-area-inset-top) + 48px);padding:6px 8px;border-radius:9px;background:rgba(0,0,0,.58);font-size:10px;pointer-events:none}
body.ready #info,body.ready #action{display:block}
#info{right:max(9px,env(safe-area-inset-right))}
#action{left:max(9px,env(safe-area-inset-left));max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#touch{position:fixed;z-index:35;left:0;top:0;width:68px;height:68px;transform:translate3d(-200px,-200px,0);opacity:0;pointer-events:none;will-change:transform,opacity}
#touch.show{opacity:1}
#touch .ring{position:absolute;inset:0;border-radius:50%;border:4px solid #56e878}
#touch.two .ring{border-color:#4fb8ff}
#touch .label{position:absolute;left:50%;bottom:73px;transform:translateX(-50%);padding:4px 7px;border-radius:7px;background:rgba(0,0,0,.74);font-size:10px;font-weight:700;white-space:nowrap}
#error{position:fixed;z-index:120;inset:0;display:none;place-items:center;background:#111;padding:24px}
#error.show{display:grid}
#error pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
#error button{border:0;border-radius:999px;background:#fff;color:#111;font-weight:750;padding:12px 22px}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
"@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.2.0/spark.module.js"
}}
</script>
<script async crossorigin="anonymous" data-preload-chunks="slam" src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"></script>
</head>
<body>
<canvas id="camerafeed"></canvas>
<div id="start"><div class="card"><h1>Backhoe Rig AR</h1><div class="sub">split v3 × JSON Animation / AR validation v0.1.2</div><button id="go">ARを開始</button><div id="boot">[0] ページ読込
AR開始ボタン待ち</div></div></div>
<div id="status">AR開始待ち</div>
<div id="action">JSON: 掘削サンプル</div>
<div id="info">23% ｜ 約1.0m</div>
<div id="hint">床をタップして配置</div>
<div id="toolbar">
<button id="play" disabled>▶ 再生</button>
<button id="replace" disabled>置き直す</button>
<button id="ground" class="on" disabled>地面 ON</button>
<label id="jsonLabel">JSON<input id="jsonInput" type="file" accept=".json,application/json"></label>
</div>
<div id="touch"><div class="ring"></div><div class="label">1本指：移動中</div></div>
<div id="error"><div><h2>ARを続行できません</h2><pre id="errorText"></pre><button onclick="location.reload()">再読み込み</button></div></div>
<script src="./bootstrap.js"></script>
</body>
</html>
