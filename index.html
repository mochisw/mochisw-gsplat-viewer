<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>gsplat viewer</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
    #canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* 左上ミニパネル(設計書5章: 引き算デザイン) */
    #panel {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      background: rgba(20, 20, 24, 0.82); color: #e8e8e8;
      border-radius: 10px; backdrop-filter: blur(6px);
      font-family: system-ui, sans-serif; font-size: 12px;
      min-width: 210px; max-width: 260px;
      user-select: none;
    }
    #panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; cursor: pointer; font-weight: 600;
    }
    #panel-body { padding: 0 12px 10px; display: grid; gap: 8px; }
    #panel.collapsed #panel-body { display: none; }
    .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .row label { flex: none; opacity: 0.85; }
    .row input[type="range"] { flex: 1; min-width: 80px; }
    #info { opacity: 0.85; line-height: 1.5; word-break: break-all; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 6px; }
    #fps { font-variant-numeric: tabular-nums; opacity: 0.7; }
    button, select {
      background: #2e2e36; color: #e8e8e8; border: 1px solid #45454f;
      border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    button:hover { background: #3a3a44; }
    .seg { display: flex; gap: 0; }
    .seg button { border-radius: 0; flex: 1; }
    .seg button:first-child { border-radius: 6px 0 0 6px; }
    .seg button:last-child { border-radius: 0 6px 6px 0; }
    .seg button.active { background: #4a90d9; border-color: #4a90d9; }
    .seg button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ドロップオーバーレイ */
    #drop-overlay {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center;
      background: rgba(30, 90, 160, 0.25); border: 3px dashed #4a90d9;
      color: #fff; font-family: system-ui, sans-serif; font-size: 20px;
      pointer-events: none;
    }
    #drop-overlay.visible { display: flex; }

    /* 読込プログレス */
    #progress {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 15; display: none; background: rgba(20,20,24,0.9); color: #fff;
      padding: 14px 22px; border-radius: 10px; font-family: system-ui, sans-serif;
      font-size: 13px; text-align: center; min-width: 220px;
    }
    #progress.visible { display: block; }
    #progress-bar { margin-top: 8px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
    #progress-fill { height: 100%; width: 0%; background: #4a90d9; transition: width 0.1s; }

    #empty-hint {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.45); font-family: system-ui, sans-serif;
      font-size: 14px; text-align: center; pointer-events: none; line-height: 1.8;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="empty-hint">PLY / SPZ ファイルをドラッグ&ドロップ<br>またはパネルからファイルを選択</div>

  <div id="panel">
    <div id="panel-header"><span>gsplat viewer</span><span id="panel-toggle">▾</span></div>
    <div id="panel-body">
      <div id="info">ファイル未読込</div>
      <div class="row">
        <button id="file-button" style="width:100%">ファイルを開く…</button>
        <input id="file-input" type="file" accept=".ply,.spz" hidden />
      </div>
      <div class="seg" id="mode-seg">
        <button id="mode-points" class="active">点</button>
        <button id="mode-splats" disabled title="Phase 3で実装">スプラット</button>
      </div>
      <div class="row">
        <label for="point-size">点サイズ</label>
        <input id="point-size" type="range" min="1" max="16" step="0.5" value="2" />
      </div>
      <div class="row">
        <label for="attenuation">距離減衰</label>
        <input id="attenuation" type="checkbox" checked />
      </div>
      <div class="row">
        <label for="flip-y">上下反転</label>
        <input id="flip-y" type="checkbox" />
      </div>
      <div class="row">
        <label>背景</label>
        <div class="seg">
          <button id="bg-black" class="active">黒</button>
          <button id="bg-white">白</button>
        </div>
      </div>
      <div class="row"><span id="fps">-- fps</span></div>
    </div>
  </div>

  <div id="drop-overlay">ここにドロップして読込</div>

  <div id="progress">
    <div id="progress-label">読込中…</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
